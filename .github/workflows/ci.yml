name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Validate patch and locale files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "const s=require('fs').readFileSync('cordis.patch.yml','utf8'); if(!s.includes('insert:')) throw new Error('patch must contain an insert block')"
      - name: Host route tests
        run: node --test tests/host.test.mjs
      - name: Client bundle smoke test
        run: node tests/client-smoke.mjs